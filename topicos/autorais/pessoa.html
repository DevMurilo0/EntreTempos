<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Publicação autoral | Entre Tempos</title>
  <meta name="description" content="Conteúdo autoral publicado na revista eletrônica Entre Tempos.">
  <link rel="icon" href="/img/amp.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Special+Elite&family=IM+Fell+English:ital@0;1&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/autorais-admin.css">
  <link rel="stylesheet" href="/topicos/autorais/pessoa.css">

  <script>
    (function () {
      const params = new URLSearchParams(window.location.search);
      if (params.get('secao') !== 'poemas') return;

      document.documentElement.classList.add('et-poemas-dinamico');

      const link = document.createElement('link');
      link.rel = 'stylesheet';
      link.href = '/topicos/poemas/autorais/autorais/pessoa.css';
      document.head.appendChild(link);
    })();
  </script>

  <style>
    .et-poemas-dinamico .et-pessoa-main {
      width: 100%;
      margin: 0;
      padding: 0;
    }

    .et-poemas-dinamico .et-pagina-mensagem {
      max-width: 900px;
      margin: 18px auto 0;
      padding: 0 20px;
    }

    .et-poemas-dinamico .et-perfil {
      position: relative;
      z-index: 5;
      display: flex;
      align-items: flex-start;
      gap: 50px;
      max-width: 900px;
      margin: 40px auto 30px;
      padding: 0 40px;
    }

    .et-poemas-dinamico .et-perfil__foto-wrap {
      display: grid;
      place-items: end center;
      width: 220px;
      height: 300px;
      flex: 0 0 220px;
      overflow: hidden;
      padding: 0;
      background: transparent;
      box-shadow: none;
      transform: none;
    }

    .et-poemas-dinamico .et-perfil__foto-wrap::after {
      display: none;
    }

    .et-poemas-dinamico .et-perfil__foto {
      display: block;
      width: 100%;
      height: 100%;
      max-width: 220px;
      max-height: 300px;
      aspect-ratio: auto;
      object-fit: contain;
      object-position: center bottom;
      background: transparent;
    }

    .et-poemas-dinamico .et-perfil__texto {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-top: 10px;
    }

    .et-poemas-dinamico .et-perfil h1 {
      padding-left: 16px;
      border-left: 5px solid #c0392b;
      color: #1a1a1a;
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(34px, 5vw, 56px);
      font-weight: normal;
      letter-spacing: 4px;
      line-height: 1;
      text-shadow: none;
    }

    .et-poemas-dinamico .et-perfil__rotulo {
      order: 2;
      margin: 0;
      padding-left: 21px;
      color: #8c3b3b;
      font-family: 'Special Elite', serif;
      font-size: 13px;
      font-style: italic;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    .et-poemas-dinamico .et-perfil h1 {
      order: 1;
    }

    .et-poemas-dinamico .et-perfil__descricao {
      order: 3;
      max-width: 560px;
      margin-top: 4px;
      padding-left: 21px;
      color: #3e3228;
      font-family: 'IM Fell English', serif;
      font-size: clamp(14px, 1.5vw, 17px);
      line-height: 1.8;
      text-align: justify;
      white-space: pre-wrap;
    }

    .et-poemas-dinamico .contador-poemas {
      order: 4;
    }

    .et-poemas-dinamico .et-admin-acoes {
      position: relative;
      z-index: 6;
      width: min(calc(100% - 40px), 900px);
      margin: 0 auto 30px;
    }

    .et-poemas-dinamico .et-pessoa-divisor {
      position: relative;
      z-index: 5;
      width: 80%;
      height: 2px;
      margin: 10px auto 50px;
      background: linear-gradient(to right, transparent, #c0392b, #c4a96b, #c0392b, transparent);
    }

    .et-poemas-dinamico .et-publicacoes__cabecalho {
      display: none;
    }

    .et-poemas-dinamico .et-conteudos {
      display: block;
      gap: 0;
    }

    .et-poemas-dinamico .et-conteudo.poema {
      border: 0;
      border-left: 0;
    }

    .et-poemas-dinamico .et-conteudo.poema .et-conteudo__cabecalho.et-poema-admin {
      display: block;
      margin: 24px 0 0;
      padding: 0;
      border: 0;
    }

    .et-poemas-dinamico .et-conteudo.poema .et-conteudo__acoes {
      width: auto;
      text-align: right;
    }

    .et-poemas-dinamico .et-conteudo.poema .et-mini-btn {
      width: auto;
      min-height: 0;
      padding: 7px 14px;
    }

    .et-poemas-dinamico .et-poema-texto {
      white-space: pre-wrap;
    }

    .et-poemas-dinamico .et-pessoa-footer {
      position: relative;
      z-index: 5;
    }

    @media (max-width: 600px) {
      .et-poemas-dinamico .et-perfil {
        flex-direction: column;
        align-items: center;
        gap: 20px;
        padding: 0 20px;
        text-align: center;
      }

      .et-poemas-dinamico .et-perfil__foto-wrap {
        width: 180px;
        height: 250px;
        flex-basis: 180px;
      }

      .et-poemas-dinamico .et-perfil__foto {
        width: 100%;
        height: 100%;
        max-width: 180px;
        max-height: 250px;
      }

      .et-poemas-dinamico .et-perfil h1 {
        padding-left: 0;
        border-left: 0;
      }

      .et-poemas-dinamico .et-perfil__rotulo,
      .et-poemas-dinamico .et-perfil__descricao,
      .et-poemas-dinamico .contador-poemas {
        padding-left: 0;
      }

      .et-poemas-dinamico .et-perfil__descricao {
        max-width: 100%;
        text-align: left;
      }
    }
  </style>
</head>
<body>
  <header class="et-pessoa-header">
    <a id="et-voltar" href="/folha.html">← Voltar</a>
    <span>entre tempos · revista eletrônica</span>
  </header>

  <main class="et-pessoa-main">
    <p class="et-pagina-mensagem" id="et-pagina-mensagem" role="status" aria-live="polite">Carregando publicação...</p>

    <section class="et-perfil">
      <div class="et-perfil__foto-wrap">
        <img id="et-pessoa-foto" src="/img/amp.png" alt="" class="et-perfil__foto">
      </div>
      <div class="et-perfil__texto">
        <p class="et-perfil__rotulo" id="et-rotulo-secao">Autoral</p>
        <h1 id="et-pessoa-nome">...</h1>
        <p class="et-perfil__descricao" id="et-pessoa-descricao"></p>
      </div>
    </section>

    <section class="et-admin-acoes" id="et-admin-acoes" hidden aria-label="Ferramentas dos pesquisadores">
      <span class="et-admin-acoes__rotulo">Gerenciar publicação</span>
      <div>
        <button class="et-btn et-btn--principal" id="et-btn-adicionar-conteudo" type="button">+ Adicionar conteúdo</button>
        <button class="et-btn et-btn--secundario" id="et-btn-editar-pessoa" type="button">Editar pessoa</button>
        <button class="et-btn et-btn--perigo" id="et-btn-excluir-pessoa" type="button">Remover pessoa</button>
      </div>
    </section>

    <div class="et-pessoa-divisor"></div>

    <section class="et-publicacoes">
      <div class="et-publicacoes__cabecalho">
        <p>publicações</p>
        <h2 id="et-conteudos-titulo">Conteúdos publicados</h2>
      </div>
      <div class="et-conteudos" id="et-conteudos"></div>
    </section>
  </main>

  <footer class="et-pessoa-footer">
    <div>entre tempos · revista eletrônica</div>
    <div class="et-pessoa-carimbo">AUTORAL</div>
  </footer>

  <script type="module" src="/js/autorais-pessoa.js"></script>

  <script>
    (function () {
      const params = new URLSearchParams(window.location.search);
      if (params.get('secao') !== 'poemas') return;

      const root = document.getElementById('et-conteudos');
      const publicacoes = document.querySelector('.et-publicacoes');
      const perfilTexto = document.querySelector('.et-perfil__texto');
      const rotulo = document.getElementById('et-rotulo-secao');
      const voltar = document.getElementById('et-voltar');
      const footer = document.querySelector('.et-pessoa-footer');
      const carimbo = document.querySelector('.et-pessoa-carimbo');

      document.body.classList.add('et-layout-poemas');

      document.querySelector('.et-perfil')?.classList.add('pessoa-section');
      document.getElementById('et-pessoa-foto')?.classList.add('foto-pessoa');
      perfilTexto?.classList.add('pessoa-info');
      document.getElementById('et-pessoa-nome')?.classList.add('pessoa-nome');
      document.getElementById('et-pessoa-descricao')?.classList.add('pessoa-bio');
      document.querySelector('.et-pessoa-divisor')?.classList.add('divisor');
      footer?.classList.add('rodape-poemas');
      carimbo?.classList.add('carimbo');

      if (voltar) voltar.textContent = '← Voltar para Autorais';
      if (carimbo) carimbo.textContent = 'POEMAS';

      let contador = document.getElementById('et-contador-poemas');
      if (!contador && perfilTexto) {
        contador = document.createElement('p');
        contador.id = 'et-contador-poemas';
        contador.className = 'contador-poemas';
        perfilTexto.appendChild(contador);
      }

      let grade = document.getElementById('et-grade-envelopes');
      if (!grade && publicacoes && root) {
        grade = document.createElement('section');
        grade.id = 'et-grade-envelopes';
        grade.className = 'grade-envelopes';
        publicacoes.insertBefore(grade, root);
      }

      root?.classList.add('area-folha');

      function romano(numero) {
        const mapa = [
          [1000, 'M'], [900, 'CM'], [500, 'D'], [400, 'CD'],
          [100, 'C'], [90, 'XC'], [50, 'L'], [40, 'XL'],
          [10, 'X'], [9, 'IX'], [5, 'V'], [4, 'IV'], [1, 'I']
        ];

        let valor = numero;
        let resultado = '';

        for (const [n, simbolo] of mapa) {
          while (valor >= n) {
            resultado += simbolo;
            valor -= n;
          }
        }

        return resultado;
      }

      function fecharPoemas() {
        grade?.querySelectorAll('.envelope').forEach((item) => item.classList.remove('ativo'));
        root?.querySelectorAll('.poema').forEach((item) => item.classList.remove('visivel', 'saindo'));
        root?.classList.remove('aberta');
      }

      function abrirPoema(botao, artigo) {
        const estavaAtivo = botao.classList.contains('ativo');
        const poemaAtual = root?.querySelector('.poema.visivel');

        grade?.querySelectorAll('.envelope').forEach((item) => item.classList.remove('ativo'));

        if (estavaAtivo) {
          if (poemaAtual) {
            poemaAtual.classList.remove('visivel');
            poemaAtual.classList.add('saindo');
            setTimeout(() => poemaAtual.classList.remove('saindo'), 400);
          }
          root?.classList.remove('aberta');
          return;
        }

        botao.classList.add('ativo');

        if (poemaAtual && poemaAtual !== artigo) {
          poemaAtual.classList.remove('visivel');
          poemaAtual.classList.add('saindo');
          setTimeout(() => poemaAtual.classList.remove('saindo'), 250);
        }

        artigo.classList.add('visivel');
        root?.classList.add('aberta');
      }

      function adaptarPoemas() {
        if (!root || !grade) return;

        if (rotulo) rotulo.textContent = 'poeta';

        const artigos = Array.from(root.querySelectorAll(':scope > .et-conteudo'));

        if (contador) {
          contador.textContent = artigos.length === 1
            ? '1 poema'
            : `${artigos.length} poemas`;
        }

        grade.replaceChildren();
        fecharPoemas();

        artigos.forEach((artigo, indice) => {
          const numero = indice + 1;
          const id = `poema-${numero}`;
          const cabecalho = artigo.querySelector('.et-conteudo__cabecalho');
          const titulo = cabecalho?.querySelector('h3');
          const autorOriginal = cabecalho?.querySelector('.et-conteudo__autor');
          const texto = artigo.querySelector('.et-poema-texto');
          const acoes = cabecalho?.querySelector('.et-conteudo__acoes');
          const tituloTexto = titulo?.textContent?.trim() || `Poema ${romano(numero)}`;

          artigo.id = id;
          artigo.classList.add('poema');

          if (!artigo.dataset.etPoemaAdaptado) {
            artigo.dataset.etPoemaAdaptado = 'true';

            const autorTexto = (autorOriginal?.textContent || '')
              .replace(/^por\s+/i, '')
              .trim() || document.getElementById('et-pessoa-nome')?.textContent?.trim() || '';

            const numeroEl = document.createElement('p');
            numeroEl.className = 'poema-numero';
            numeroEl.textContent = `Poema ${romano(numero)}`;

            const dataEl = document.createElement('p');
            dataEl.className = 'poema-data';
            dataEl.textContent = `escrito em — ${new Date().getFullYear()}`;

            const assinatura = document.createElement('p');
            assinatura.className = 'poema-assinatura';
            assinatura.textContent = autorTexto ? `— ${autorTexto}` : '';

            if (titulo) titulo.classList.add('poema-titulo');
            if (texto) texto.classList.add('poema-texto');

            const blocoTitulos = cabecalho?.querySelector(':scope > div:first-child');
            if (titulo && texto) artigo.insertBefore(titulo, texto);
            if (texto) artigo.insertBefore(dataEl, texto);
            artigo.insertBefore(numeroEl, artigo.firstChild);
            if (texto) texto.after(assinatura);

            blocoTitulos?.remove();

            if (cabecalho && acoes) {
              cabecalho.classList.add('et-poema-admin');
              artigo.appendChild(cabecalho);
            } else {
              cabecalho?.remove();
            }
          }

          const envelope = document.createElement('button');
          envelope.type = 'button';
          envelope.className = 'envelope';
          envelope.dataset.alvo = id;
          envelope.innerHTML = `
            <span class="env-numero">${romano(numero)}</span>
            <span class="env-titulo"></span>
            <span class="env-aba"></span>
          `;
          envelope.querySelector('.env-titulo').textContent = tituloTexto;
          envelope.addEventListener('click', () => abrirPoema(envelope, artigo));
          grade.appendChild(envelope);
        });
      }

      document.addEventListener('DOMContentLoaded', () => {
        setTimeout(adaptarPoemas, 0);
      });

      if (root) {
        const observer = new MutationObserver((mutacoes) => {
          if (mutacoes.some((item) => item.type === 'childList')) {
            setTimeout(adaptarPoemas, 0);
          }
        });

        observer.observe(root, { childList: true });
      }
    })();
  </script>
</body>
</html>
