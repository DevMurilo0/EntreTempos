<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Livros - Entre Tempos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Special+Elite&family=Permanent+Marker&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="livros.css">
</head>

<body>

  <div class="pagina-livros">

    <!-- Imagens decorativas — soltas na largura total da página -->
    <div class="deco-container">
      <img loading="lazy" decoding="async" src="img/deco_01.webp" alt="" class="img-deco img-deco-01">
      <img loading="lazy" decoding="async" src="img/deco_02.webp" alt="" class="img-deco img-deco-02">
      <img loading="lazy" decoding="async" src="img/deco_03.webp" alt="" class="img-deco img-deco-03">
      <img loading="lazy" decoding="async" src="img/deco_04.webp" alt="" class="img-deco img-deco-04">
      <img loading="lazy" decoding="async" src="img/deco_05.webp" alt="" class="img-deco img-deco-05">
    </div>

    <!-- Símbolos de fundo -->
    <div class="simbolos-fundo">
      <span class="simbolo" style="top:10%;left:5%;animation-delay:0s">✦</span>
      <span class="simbolo" style="top:25%;left:90%;animation-delay:1s">❧</span>
      <span class="simbolo" style="top:50%;left:12%;animation-delay:2s">§</span>
      <span class="simbolo" style="top:70%;left:82%;animation-delay:3s">✦</span>
      <span class="simbolo" style="top:85%;left:40%;animation-delay:1.5s">❧</span>
      <span class="simbolo" style="top:38%;left:58%;animation-delay:3.5s">§</span>
    </div>

    <header>
      <a href="../../folha.html">← Voltar</a>
    </header>

    <div class="page-titulo">
      <h1>LIVROS</h1>
      <p class="subtitulo">top 5 · entre tempos</p>
    </div>
    <div class="divisor"></div>

    <div class="mural-livros">

      <div class="top10-wrapper">

        <!-- LISTA TOP 10 -->
        <div class="top10-lista">

          <!-- Navegação de mês -->
          <div class="nav-mes">
            <button class="seta-mes" id="seta-esq" aria-label="Mês anterior">&#8592;</button>
            <div class="top10-titulo">
              TOP 10
              <span class="mes-label" id="mes-atual">Junho</span>
            </div>
            <button class="seta-mes" id="seta-dir" aria-label="Próximo mês">&#8594;</button>
          </div>

          <!-- Lista gerada pelo JS -->
          <ul class="lista-livros" id="lista-livros"></ul>

        </div>
      </div>
    </div>

  </div><!-- /.pagina-livros -->

  <div class="rodape-livros">
    <div>entre tempos · revista eletrônica</div>
    <div class="carimbo">LIVROS</div>
  </div>

  <!-- MODAL — abre ao clicar em um livro da lista, mostra capa,
     descrição e o link de download/compra daquele livro. -->
  <div class="modal-livro-overlay" id="modal-livro" aria-hidden="true">
    <div class="modal-livro-caixa" role="dialog" aria-modal="true" aria-labelledby="modal-livro-titulo">
      <button class="modal-fechar" id="modal-fechar" aria-label="Fechar">&times;</button>
      <div class="modal-livro-conteudo">
        <img src="" alt="" class="modal-livro-capa" id="modal-livro-capa">
        <div class="modal-livro-info">
          <h2 class="modal-livro-titulo" id="modal-livro-titulo"></h2>
          <p class="modal-livro-autor" id="modal-livro-autor"></p>
          <p class="modal-livro-desc" id="modal-livro-desc"></p>
          <a href="#" class="modal-livro-link" id="modal-livro-link" target="_blank" rel="noopener">Acessar</a>
        </div>
      </div>
    </div>
  </div>

  <script src="livros.js"></script>
</body>

</html>
