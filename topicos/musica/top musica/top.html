<body>

  <div class="notas-musicais">

    <img loading="lazy" decoding="async" src="img/mulher_foto.webp" alt="Artista"
      class="img-deco img-mulher deco-desktop">
    <img loading="lazy" decoding="async" src="img/caixa_som.webp" alt="Caixa de som"

  <div class="rodape-musica">
    <div>entre tempos · revista eletrônica</div>
