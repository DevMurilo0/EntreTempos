<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enquetes - Entre Tempos</title>
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Entre Tempos">
  <meta property="og:title" content="Enquetes - Entre Tempos">
  <meta property="og:description" content="Conteúdo da revista eletrônica Entre Tempos.">
  <meta property="og:url" content="https://entretempos.vercel.app/topicos/enquetes/enquetes.html">
  <meta property="og:image" content="https://entretempos.vercel.app/img/social/entre-tempos-share.jpg">
  <link rel="icon" href="../../img/amp.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Special+Elite&family=IM+Fell+English:ital@0;1&family=Dancing+Script:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="enquetes.css">
</head>
<body class="pagina-enquetes">
  <main class="enquetes-main">
    <a class="enquetes-voltar" href="../../folha.html">← Voltar à página inicial</a>
    
    <header class="enquetes-header">
      <div class="enquetes-header-info">
        <p class="enquetes-revista">Entre Tempos</p>
        <h1>Enquetes (Top 20)</h1>
        <div class="enquetes-filtros" role="group" aria-label="Filtrar enquetes">
          <span class="enquetes-filtros-rotulo">Filtrar por:</span>
          <div class="enquetes-filtros-botoes">
            <button type="button" class="enquetes-btn-filtro ativo" data-filtro="recentes" aria-pressed="true">Mais recentes</button>
            <button type="button" class="enquetes-btn-filtro" data-filtro="votados" aria-pressed="false">Mais votados</button>
          </div>
        </div>
      </div>
      <button id="btn-add-enquete" class="enquetes-btn-principal enquetes-btn-add">Adicionar Enquete</button>
    </header>

    <section class="enquetes-lista" id="lista-enquetes">
      <div class="enquetes-mensagem-estado">
        Carregando enquetes...
      </div>
    </section>
  </main>

  <div id="modal-enquete" class="enquetes-modal" hidden>
    <div class="enquetes-modal-box">
      <h2 class="enquetes-modal-title">Nova Enquete</h2>
      <form id="form-enquete">
        <div class="enquetes-campo">
          <label for="enquete-nome">Nome</label>
          <input type="text" id="enquete-nome" class="enquetes-input" required>
        </div>
        <div class="enquetes-campo">
          <label for="enquete-tipo">Tipo</label>
          <select id="enquete-tipo" class="enquetes-input" required>
            <option value="" disabled selected>Selecione um tipo...</option>
            <option value="musica">Música</option>
            <option value="filme">Filme</option>
            <option value="livro">Livro</option>
          </select>
        </div>
        <div class="enquetes-campo">
          <label for="enquete-conteudo">Conteúdo <span id="tag-conteudo-opcional" style="font-size: 13px; font-style: italic; color: #7a6a50;">(opcional)</span></label>
          <textarea id="enquete-conteudo" class="enquetes-input enquetes-textarea"></textarea>
        </div>
        <div class="enquetes-campo">
          <label>Formato da Enquete</label>
          <div class="enquetes-formato-opcoes">
            <label class="enquetes-formato-label">
              <input type="radio" name="enquete-formato" value="com-votacao" id="formato-com-votacao" checked>
              <span>Com votação</span>
            </label>
            <label class="enquetes-formato-label">
              <input type="radio" name="enquete-formato" value="sem-votacao" id="formato-sem-votacao">
              <span>Sem votação</span>
            </label>
          </div>
        </div>
        <div class="enquetes-campo" id="campo-opcoes-votacao">
          <div class="enquetes-opcoes-cabecalho">
            <label>Opções de Voto</label>
            <span id="enquetes-contador-opcoes" class="enquetes-contador-opcoes">2/20</span>
          </div>
          <div id="enquetes-lista-opcoes" class="enquetes-lista-opcoes">
            <div class="enquetes-opcao-linha">
              <input type="text" class="enquetes-input enquete-opcao-input" placeholder="Opção 1" required>
            </div>
            <div class="enquetes-opcao-linha">
              <input type="text" class="enquetes-input enquete-opcao-input" placeholder="Opção 2" required>
            </div>
          </div>
          <button type="button" id="btn-add-opcao" class="enquetes-btn-add-opcao">+ Criar nova opção</button>
        </div>
        <p id="enquete-mensagem" class="enquetes-msg-erro"></p>
        <div class="enquetes-modal-acoes">
          <button type="button" id="btn-cancelar-enquete" class="enquetes-btn-secundario">Cancelar</button>
          <button type="submit" id="btn-salvar-enquete" class="enquetes-btn-principal">Salvar</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="../../js/enquetes.js"></script>
</body>
</html>
